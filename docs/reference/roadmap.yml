# Roadmap, as data, for the overview at westerweel.work/nu/ (ratatoskr's status_site.py reads it).
# Drafted 2026-11-07 by the odin coding session from Mark's decisions in chat. An item is "done"
# only with evidence (a PR, issue or doc); everything else is "open".
# Schema: project, goal, current (a phase id), phases [id, name, summary], and done_means for the
# current phase [item, status done|open, evidence].
project: bubbels
goal: "One app of play-and-learn games for children of 3 to 10: no ads, no trackers, one €1 purchase that opens every game."
current: launch
phases:
  - {id: game, name: "Bubbels, the first game", summary: "the bubble shooter: 30 levels, pop sounds, offline, playable on the web"}
  - {id: launch, name: "Brand app in the stores", summary: "one app with a tile per game, Dutch and English, the €1 unlock behind a parental gate, on Google Play and then the App Store"}
  - id: learning
    name: "Learning games"
    summary: "games that teach, for children who cannot read yet and for those who can"
    # The next phase's done-means, open until built and verified (the overview shows done_means
    # for the current phase only).
    done_means:
      - {item: "Picturedoku, a picture sudoku: 4x4 with pictures and no numbers for ages 3-6, 6x6 for 6-8, 9x9 for 8-10 (numbers optional); 60 puzzles, each unique and solvable without guessing, 10 free", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/6 + review fixes in https://github.com/MWest2020/bazibo/pull/7"}
      - {item: "Dogudoku: a Queens-style puzzle with puppies (one per row, column and colour, never touching on every size). 4x4 with bushes for ages 3-5, 5x5 with colours for 5-7, 6x6 to 8x8 for 7-10; 60 puzzles, each with exactly one solution, 10 free", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/5"}
      - {item: "Paartjes (Pairs): flip cards to find pairs on 6, 12, 16 or 20 cards, fruit, picture-book and shapes cards drawn in code; alone with stars by turns (no clock), together on one screen, or against a gentle computer that forgets; free: 6 and 12 cards with fruit", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/37"}
      - {item: "Legpuzzel (Jigsaw), the puzzle game Mark asked for (a jigsaw rather than a sliding puzzle): 9 to 60 pieces with round tabs (ages per Mark, 17 Nov 2026: 9 pieces 3+, 16 4+, 25 5+, 30 6+, 48 7+, 60 9+; nothing for two-year-olds), dragged to snap into place, a magnifier for small pieces on phones, eight scenes drawn in code, a faint example picture that can be turned off; free: 9, 16 and 25 pieces with three pictures", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/39 + harder sizes in https://github.com/MWest2020/bazibo/pull/46 + sizes by age in https://github.com/MWest2020/bazibo/pull/53"}
      - {item: "Vier op een rij: four in a row on 7x6 (ages 6+) and three in a row on a 5x4 kleuterbord (ages 3+); two players on one screen, or the computer at easy, medium and hard (hard in the full version); own name and look", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/11"}
      - {item: "Dammen (Checkers): 8x8 with Dutch rules (compulsory capture, men capture backwards, multi-captures, kings one step), the pieces that must capture glow; two players on one screen or the easy computer, with take-back; full version: medium and hard computer (alpha-beta in a worker) and the international 10x10 board (flying kings, take the most); puppy and kitten pieces or a classic look", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/29"}
      - {item: "Tijgers en geitjes (Bagh-Chal), the traditional Nepali tigers-and-goats game Mark asked for: 5x5 grid with the classic lines, 4 tigers on the corners, 20 goats placed one per turn then walked, tigers step or jump one goat; 5 captures or a trap wins, repetition or 50 quiet moves each is a draw; a captured goat sleeps in the meadow, friendly tigers, no timers; tap-tap or drag; two players, or the computer as goats or tigers (easy free; medium and hard alpha-beta in a worker in the full version), take-back", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/66"}
      - {item: "Schaken (Chess), the board game Mark asked for: the complete FIDE rules (castling with all its conditions, en passant, promotion with the child's choice, mate, stalemate, automatic draws by threefold repetition, the 50-move rule and insufficient material), the move generator checked by perft; only legal moves glow (a ring for a capture), tap-tap or drag, a gentle glow on a king in check, own friendly pieces drawn in code, tap-nearest on small phones; two players, or the computer as black (easy with a hint, free; medium and hard alpha-beta in a worker in the full version), take-back", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/72"}
      - {item: "Ganzenbord (Game of the Goose): our own spiral board of 63 squares drawn in code with the classic squares made kind (well and prison at most two turns, lost in the woods instead of death, bounce at 63), two animated dice with the classic first throw (6+3 to 26, 5+4 to 53) and \"count yourself\" by tapping, without a voice; free: the classic board with 2 players (child against a computer goose or two children); full version: up to 4 players and winter and sea boards", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/30"}
      - {item: "Pachisi, the original race game from India (Mark, 19 Nov 2026: instead of the trademarked spin-offs): our own cloth board of four 3x8 arms round the Charkoni with the 12 castles, 2-4 players with 2 or 4 pawns, six cowrie shells counted by the child (the traditional six-shell table: 2-6, 10, 25; graces throw again), captures that send a pawn walking back to the middle, rules from Wikipedia with documented child simplifications; a computer at easy (free) and medium (full version, with 3-4 players), take-back, no timers or voice", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/73"}
      - {item: "Ludo instead of Pachisi as the main race game (Mark, 19 Nov 2026, after playtesting: Pachisi was too different from what Dutch children know): one die, the rules Dutch families play (a 6 brings a pawn out and throws again and must bring one out when the start is free, three tries with no pawn on the track, no safe squares, never onto your own pawn, exact throw into the 4 home squares) on our own 40-square cross drawn in Bazibo's soft style; the die's pips counted by tapping, the gentle capture, the touch picking, take-back and the hand-off kept; a computer at easy (a sensible child wins 3 in 4) and medium; Pachisi stays as a second mode in the game's menu; the id stays pachisi so saves and transfer codes keep working", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/75"}
      - {item: "Kwartet (Quartets): the Dutch card game, a child against 1-3 computer players or children on one phone (a pass card hides the hands); eight sets of four cards with pictures and names, the missing cards of your sets as big ask buttons, speech bubbles and slow, visible computer turns; free: 4 sets with up to 3 players", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/38"}
      - {item: "Kwartet with the real rules for two (Mark, 17 Nov): two players get 5-7 cards each and the rest is the pile (a no means drawing, the asked-for card keeps the turn, an empty hand draws, an empty pile just passes); three or four share every card without a pile; the computer remembers who asked for what", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/48"}
      - {item: "Slangetje: a snake that eats numbers in order (counting up to 20, in twos, counting down), the letters of a word with a picture (Dutch and English words), or only one colour of fruit; slow with wrap-around edges and no way to lose for ages 3-5, walls and bumps for 7-10; 30 levels, 10 free", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/12"}
      - {item: "Random play in the full version: a \"Random\" card per difficulty in Bubbels, Dogudoku, Picturedoku and Slangetje; boards and puzzles made on the device (a worker for the big ones), each checked (unique solution, clearable, safe start), a solved count per tier", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/16"}
      - {item: "Kleurplaten: tap-to-colour pictures for ages 3-6 (13, 6 free) and mandalas made in code for 7-10 (3 free, endless new ones in the full version, a mirror button for all copies); every page kept in My pictures", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/17"}
      - {item: "Tekenen: free drawing with every colour, three brushes, an eraser and undo; mirror mode with 2, 4, 6 or 8 lines (every stroke a mandala) and five stamps in the full version; drawings kept in My drawings (3 free, up to 100 in the full version)", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/26"}
      - {item: "Klok kijken: set an analogue clock (drag the hands or + and -), read it (pick from plausible mistakes), and a daily rhythm with a sun or moon for the youngest; whole hours to single minutes and the 24-hour clock; correct Dutch and English phrasing for every 5-minute step; rounds of 10 with stars, whole and half hours free", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/18"}
      - {item: "Klok kijken, Digitaal (a user asked for digital clocks): digital time to and from the analogue clock (whole and half hours, free), setting a seven-segment digital clock with hour and minute steppers to a clock or to words and saying a digital time in words (quarters and five minutes), and the 24-hour clock with the parts of the day (0-6 night, 6-12 morning, 12-18 afternoon, 18-24 evening) and which time is later; every 5-minute step of the day phrased and tested in Dutch and English", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/68"}
      - {item: "A roadmap page for parents (bazibo.nl/nl/plannen, /en/roadmap): what is in Bazibo now and what comes next, in order and without dates", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/18"}
      - {item: "Move progress between devices with a QR code, without the internet", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/20"}
      - {item: "Tel & Plop: shoot the bubble with the right number of dots, or the answer to a sum", status: open, evidence: "https://github.com/MWest2020/bazibo/issues/2"}
      - {item: "Piano: a toy piano with 8 coloured and 5 black keys (multi-touch, a slide plays every key it passes, a synthesised toy-piano sound that follows the sound setting); play along with a song (the next key glows, the notes to come in the keys' colours) and a Listen button that plays it with the keys lighting up; no voice or recordings; free: free play and Vader Jacob, the full version adds Kortjakje, Au clair de la lune and Ode to Joy", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/42"}
      - {item: "Piano by age (Mark, 17 Nov): 4-6 the toy piano as it was; 7-10 two octaves (C4-C6) with the black keys, a window on an upright phone that follows the song (and a map to slide it), and five harder public-domain songs checked note for note against LilyPond scores: the whole Ode to Joy in D (free), Wilhelmus, In the Hall of the Mountain King, the Rondo alla turca opening and Für Elise (full version)", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/49"}
      - {item: "Drumstel (Drums): a drum kit drawn in code with 8 pads (kick, snare, hi-hat, three toms, crash, ride), multi-touch, synthesised drum sounds that follow the sound setting; play along with a rhythm after a count-in (the next pad glows on the beat), for 4-6 at your own pace (order only) and for 7-10 on the beat with two pads at once; a Listen button; no voice or recordings; free: free play and the rock beat of each level, the full version adds a march, Vader Jacob, a pony gallop and disco", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/51"}
      - {item: "Papegaai (Parrot), the record-your-voice game Mark asked for (20 Nov 2026: children love hearing themselves): a parrot drawn in code says back what the child says (hold or tap the big button, up to 10 s), its beak and sound waves moving with the sound; voices made on the device from the child's own recording with Web Audio (no samples, no speech synthesis): Gewoon, Muis and Beer free, Achteruit, Echo, Koor and Ballon in the full version; a limiter on playback; privacy as a hard rule: the recording stays in memory only, never stored or sent, dropped on leaving or the background; the microphone only while recording, after the parental gate the first time on a device; a calm card when it is refused or missing", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/79"}
      - {item: "Letters without a voice (the Piper voice removed on Mark's word, 13 Nov): find the same letter (a capital with its small letter, mirrored look-alikes), the missing first letter of a pictured word, build a word (traced, seen for a moment, then from the picture)", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/21 + https://github.com/MWest2020/bazibo/pull/28"}
      - {item: "Letters harder after Mark's playtest (18 Nov): tiers harder by look-alikes and case instead of more tiles (tap: a look-alike from tier 1, mirrored b/d/p/q in tier 3; build: the word only for a moment in tier 1, then the picture only, extra tiles that look like the word's letters), a new middle-letter round (\"k_t\"), and the last letter of a four-letter word going in again", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/56 + https://github.com/MWest2020/bazibo/pull/57"}
      - {item: "Verstoppertje (Hide and Seek), Mark's search game (20 Nov 2026, \"lift a little stone or look behind a little tree; if it's not there another little figure waves\"): find the animal shown at the top behind one of the spots drawn into a garden, forest, beach or farm (stones, bushes, pots, buckets, hay, shells, a sandcastle, a log, a little door in a stump, advent-calendar windows); a friendly creature waves behind every other spot and the spot stays ajar; never wrong, no timers, no voice, stars by extra looks only; t1 4-5 spots and one animal (free in the garden), t2 two animals, t3 look-alikes told apart by a scarf, bow or flower and a do-you-remember question; spots 64 px or more on every screen", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/77"}
      - {item: "Kangoeroe op de getallenlijn (Kangaroo Hops): adding and taking away by hops on a number line, as taught in groep 3-4; the child picks the hops (+1/-1, +10/-10, 2s and 5s) drawn as arcs, or taps the line, then Hier!; a wrong answer bounces back and draws the way (via 10); no timers, no voice; t1 0-10 forward (free), t2 0-20 with the missing number, t3 0-100 with tens, two steps and counting by 2s and 5s", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/62"}
      - {item: "Kaartpuzzel (Map Puzzle): topography with map packs from Natural Earth (public domain) so children outside the Netherlands are served too: Continents (with the oceans) and Europe for everyone, the own country by device language (the Netherlands, the United States, the United Kingdom; none otherwise, changeable in the menu); t1 a puzzle with the borders (drag, snaps in), t2 \"Waar ligt...?\", t3 the whole puzzle without borders and the capitals or oceans; no timers, a gentle bounce and a glow after two tries, stars by mistakes; small regions tappable on 320 px and a magnifier; free: the whole Continents pack and tier 1 of every pack", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/64"}
      - {item: "Egeltje (Little Hedgehog), the maze game Mark asked for (\"like eating an alphabet\", 18 Nov) without anything of Pac-Man: a hedgehog in a seeded garden maze picks up the alphabet (a-e, ten in a row, all of it), pictured words (shown, then the picture only) or numbers (1-5, 1-10, in twos), harder by look-alikes rather than speed; a wrong letter is a soft bump, a crow it walks into flutters off (since 19 Nov: no rolling back, and always a way no crow stands on), no dying, no timer, stars by wrong letters only; tier 1 free", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/60 + always a way past the crows in https://github.com/MWest2020/bazibo/pull/71"}
  - id: v2
    name: "Bazibo 2.0: calm design"
    summary: "a calmer, trustworthy look in phases (docs/design/v2-proposal.md, approved by Mark 21 Nov 2026); the games keep their rules"
    done_means:
      - {item: "Phase 1a, the foundation: design tokens in web/css/style.css (colours still today's brand, so the new palette is one block), the vendored OFL font (Nunito as Bazibo Sans), empty stars as outlines, no points in Bubbels, AA contrast for locked text, white on orange and the focus ring", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/86"}
      - {item: "Phase 1b, locked choices out of the child's way: one quiet \"Volledige versie\" fold at the end of every game menu instead of padlocks between the free choices", status: open, evidence: "https://github.com/MWest2020/bazibo/pull/87"}
      - {item: "The new brand (logo, palette, store set, trust row) from the designer brief, swapped into the token block", status: open, evidence: "https://github.com/MWest2020/bazibo/blob/main/docs/design/brand-brief.md"}
done_means:
  - {item: "Bubbels finished: 30 levels, sounds, offline, Dutch and English", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/3"}
  - {item: "Brand shell: home screen with game tiles, settings, one purchase for every game", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/3"}
  - {item: "Android and iOS projects, €1 unlock through the stores, parental gate, privacy policy", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/1"}
  - {item: "Brand name in the app, the native app names, the store texts and the privacy pages (Idaveld, issue #2 default)", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/5"}
  - {item: "Brand name Bazibo (Mark's choice, issue #2) with a gazebo logo: app icons, splash screens, home screen, store icon and feature graphic", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/8"}
  - {item: "Release AAB signed with the Play upload key (Play App Signing)", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/3"}
  - {item: "Release automation built: fastlane lanes (build, internal, promote, metadata; iOS beta and metadata), signed build verified, lanes and store limits checked in CI; the upload lanes stay unverified until the Play key exists", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/4"}
  - {item: "First automated release: uploads to Play internal testing through the Play API with the service-account key (1.0.0 on 9 Nov; 1.1 to 1.5.1 since)", status: done, evidence: "https://github.com/MWest2020/bazibo/releases/tag/v1.0.0"}
  - {item: "The €1 purchase tested on a real device (Play internal testing): buy, restart, offline, restore; and Move progress with the camera on two devices (Mark, 9 and 10 Nov)", status: done, evidence: "https://github.com/MWest2020/bazibo/blob/main/docs/release.md#device-tests"}
  - {item: "Live on Google Play: 1.8.0 (version code 10, all fifteen games, store listing #43) approved; the public store page shows version 1.8.0, updated 17 Nov 2026 (checked 18 Nov)", status: done, evidence: "https://play.google.com/store/apps/details?id=work.westerweel.bazibo"}
  - {item: "bazibo.nl links parents to Google Play (home screen behind the parental gate, Plannen and Roadmap) with \"App Store: coming soon\"; never shown inside the app", status: done, evidence: "https://github.com/MWest2020/bazibo/pull/59"}
  - {item: "Google Play update to 1.13.1 (version code 16, twenty-four games: Verstoppertje, Papegaai, Schaken, Ludo with Pachisi, Egeltje, Kangoeroe, Kaartpuzzel, Tijgers en geitjes, Klok Digitaal and the rest since 1.8.0, plus the tablet and playtest fixes) submitted to internal and production on 21 Nov 2026, replacing 1.12.0 to 1.13.0 before review; in review at Google (the public page still shows 1.8.0, checked 21 Nov)", status: open, evidence: "https://play.google.com/store/apps/details?id=work.westerweel.bazibo"}
  - {item: "Live on the App Store", status: open, evidence: "https://github.com/MWest2020/bazibo/blob/main/docs/release.md"}
