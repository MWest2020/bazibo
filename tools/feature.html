<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Bubbels feature graphic</title>
<link rel="stylesheet" href="../web/css/style.css">
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: none; }
  canvas { position: absolute; inset: 0; }
  .t { position: absolute; left: 455px; top: 130px; font-family: var(--font); color: #fff; }
  .t h1 { margin: 0; font-size: 116px; font-weight: 900; line-height: 1; letter-spacing: 1px; text-shadow: 0 8px 0 rgba(30, 20, 110, 0.35); }
  .t p { margin: 22px 0 0; font-size: 44px; font-weight: 900; opacity: 0.95; }
</style></head>
<body>
<canvas id="c" width="1024" height="500"></canvas>
<div class="t"><h1>Bubbels</h1><p>Geen reclame. Nooit.</p></div>
<script type="module">
// Play Store feature graphic (1024x500), drawn with the game's own bubbles.
// Rendered by tools/store_shots.py.
import { drawBubble, COLORS } from '../web/js/bubble-art.js';
import { BRAND } from '../web/js/brand.js';
// ?lang=en for the English listing; the line is the promise from the home screen
const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'nl';
document.documentElement.lang = lang;
document.querySelector('.t h1').textContent = BRAND.name;
document.querySelector('.t p').textContent = lang === 'en' ? 'No ads. Ever.' : 'Geen reclame. Nooit.';
const ctx = document.getElementById('c').getContext('2d');
const g = ctx.createLinearGradient(0, 0, 1024, 500);
g.addColorStop(0, '#6B5CF0');
g.addColorStop(1, '#3B2FA8');
ctx.fillStyle = g;
ctx.fillRect(0, 0, 1024, 500);
const B = (x, y, r, c) => drawBubble(ctx, x, y, r, COLORS[c], { symbol: false });
B(190, 300, 125, 0);
B(345, 335, 92, 1);
B(310, 150, 72, 4);
B(120, 120, 46, 2);
B(420, 460, 34, 3);
B(980, 70, 40, 5);
B(930, 450, 28, 1);
document.documentElement.dataset.ready = '1';
</script>
</body></html>
