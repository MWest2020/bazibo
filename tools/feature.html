<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><title>Bazibo feature graphic</title>
<style>
  html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; background: #fbf7f0; }
  img { display: block; width: 1024px; height: 500px; }
</style></head>
<body>
<img alt="">
<script type="module">
// Play Store feature graphic (1024x500): the brand's own (design/brand/store/, round 3, CC0), the
// cut-paper b above the drawn name, one line and the trust row, all type as outlines. Dutch is the
// designer's feature-graphic.svg; English is feature-graphic-en.svg, the same with the English
// caption and trust row of the English screenshot frame. Rendered by tools/store_shots.py.
const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'nl';
document.documentElement.lang = lang;
const img = document.querySelector('img');
img.onload = () => { document.documentElement.dataset.ready = '1'; };
img.src = `../design/brand/store/feature-graphic${lang === 'en' ? '-en' : ''}.svg`;
</script>
</body></html>
