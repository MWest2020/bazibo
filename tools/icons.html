<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Bazibo icons</title></head>
<body>
<script type="module">
// Renders every app icon and launch screen from the brand files in design/brand/ (round 3, CC0):
// icon/icon.svg (the cut-paper b on its scraps, on a flat ink field), adaptive/*.svg (the Android
// layers) and logo/mark.svg (the mark alone, for the favicon and the launch screens). Used by
// tools/make_icons.py; open it through a local server at the repository root to look at it.
const INK = '#28245c';   // the icon's field (design/brand/tokens.json: ink)
const PAPER = '#fbf7f0'; // the launch screen (base)

const load = (path) => new Promise((resolve, reject) => {
  const img = new Image();
  img.onload = () => resolve(img);
  img.onerror = () => reject(new Error(`cannot load ${path}`));
  img.src = path;
});
const [ICON, FG, MONO, MARK] = await Promise.all([
  load('../design/brand/icon/icon.svg'),
  load('../design/brand/adaptive/foreground.svg'),
  load('../design/brand/adaptive/monochrome.svg'),
  load('../design/brand/logo/mark.svg'),
]);

function canvas(w, h = w) {
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  return [c, c.getContext('2d')];
}

// shape: 'rounded' (web 'any', Android legacy), 'square' (maskable, iOS, Play: the stores round it),
// 'circle' (Android round legacy). icon.svg keeps the mark inside the centre 58%, inside every
// safe zone (maskable 80%), so every shape is the same drawing, only clipped.
function icon(size, shape) {
  const [c, ctx] = canvas(size);
  ctx.beginPath();
  if (shape === 'circle') ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
  else if (shape === 'rounded') ctx.roundRect(0, 0, size, size, size * 0.22);
  else ctx.rect(0, 0, size, size);
  ctx.clip();
  ctx.drawImage(ICON, 0, 0, size, size);
  return c.toDataURL('image/png');
}

// an Android adaptive layer (108 dp) at this size: the foreground or the monochrome
function layer(img, size) {
  const [c, ctx] = canvas(size);
  ctx.drawImage(img, 0, 0, size, size);
  return c.toDataURL('image/png');
}

// the mark alone on transparency: the favicon (a browser tab is light or dark, the mark holds on both)
function mark(size) {
  const [c, ctx] = canvas(size);
  ctx.drawImage(MARK, 0, 0, size, size);
  return c.toDataURL('image/png');
}

// Launch screen: the paper with the mark in the middle, as the home screen opens.
function splash(w, h) {
  const [c, ctx] = canvas(w, h);
  ctx.fillStyle = PAPER;
  ctx.fillRect(0, 0, w, h);
  const size = Math.round(Math.min(w, h) * 0.3);
  ctx.drawImage(MARK, Math.round((w - size) / 2), Math.round((h - size) / 2), size, size);
  return c.toDataURL('image/png');
}

function nativeSet() {
  const out = {};
  const dens = { mdpi: 1, hdpi: 1.5, xhdpi: 2, xxhdpi: 3, xxxhdpi: 4 };
  for (const [d, f] of Object.entries(dens)) {
    out[`android/app/src/main/res/mipmap-${d}/ic_launcher.png`] = icon(48 * f, 'rounded');
    out[`android/app/src/main/res/mipmap-${d}/ic_launcher_round.png`] = icon(48 * f, 'circle');
    out[`android/app/src/main/res/mipmap-${d}/ic_launcher_foreground.png`] = layer(FG, 108 * f);
    out[`android/app/src/main/res/mipmap-${d}/ic_launcher_monochrome.png`] = layer(MONO, 108 * f);
  }
  const splashes = { mdpi: [480, 320], hdpi: [800, 480], xhdpi: [1280, 720], xxhdpi: [1600, 960], xxxhdpi: [1920, 1280] };
  for (const [d, [w, h]] of Object.entries(splashes)) {
    out[`android/app/src/main/res/drawable-land-${d}/splash.png`] = splash(w, h);
    out[`android/app/src/main/res/drawable-port-${d}/splash.png`] = splash(h, w);
  }
  out['android/app/src/main/res/drawable/splash.png'] = splash(480, 320);
  out['ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png'] = icon(1024, 'square');
  for (const n of ['splash-2732x2732.png', 'splash-2732x2732-1.png', 'splash-2732x2732-2.png']) {
    out[`ios/App/App/Assets.xcassets/Splash.imageset/${n}`] = splash(2732, 2732);
  }
  out['store/play-icon-512.png'] = icon(512, 'square');
  return out;
}

window.icons = {
  'favicon-32.png': mark(32),
  'apple-touch-icon.png': icon(180, 'square'),
  'icon-192.png': icon(192, 'rounded'),
  'icon-512.png': icon(512, 'rounded'),
  'icon-maskable-512.png': icon(512, 'square'),
};
if (new URLSearchParams(location.search).has('native')) window.nativeIcons = nativeSet();
document.body.append(...Object.values(window.icons).map((src) => Object.assign(new Image(), { src })));
document.body.style.background = INK;
</script>
</body></html>
