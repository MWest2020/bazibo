apply plugin: 'com.android.application'

android {
    namespace = "work.westerweel.bubbels"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "work.westerweel.bubbels"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // fastlane passes the next code Play expects (-PbubbelsVersionCode); a plain build stays at 1
        versionCode((project.findProperty("bubbelsVersionCode") ?: "1") as Integer)
        versionName((project.findProperty("bubbelsVersionName") ?: "1.0.0") as String)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Upload key for Play (see docs/release.md). The properties file (storeFile, storePassword,
    // keyAlias, keyPassword) is never in the repo: $BUBBELS_KEYSTORE_PROPERTIES, else
    // ~/.config/bubbels/keystore.properties. With neither, bundleRelease makes an unsigned AAB.
    def keystoreEnv = System.getenv('BUBBELS_KEYSTORE_PROPERTIES')
    def keystorePath = keystoreEnv ?: "${System.getProperty('user.home')}/.config/bubbels/keystore.properties"
    def keystoreFile = new File(keystorePath)
    if (keystoreEnv && !keystoreFile.exists()) {
        // a misspelled path must not quietly give an unsigned release
        throw new GradleException("BUBBELS_KEYSTORE_PROPERTIES points to a file that does not exist: ${keystoreEnv}")
    }
    if (rootProject.file('keystore.properties').exists()) {
        logger.warn("android/keystore.properties is no longer read; move it to ~/.config/bubbels/ or set BUBBELS_KEYSTORE_PROPERTIES (docs/release.md)")
    }
    def signed = keystoreFile.exists()
    if (signed) {
        def ks = new Properties()
        keystoreFile.withInputStream { ks.load(it) }
        def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !ks[it] }
        if (missing) throw new GradleException("${keystoreFile} lacks: ${missing.join(', ')} (docs/release.md)")
        def store = new File(ks['storeFile'])
        if (!store.isAbsolute()) store = new File(keystoreFile.parentFile, ks['storeFile'])
        if (!store.exists()) throw new GradleException("the keystore named in ${keystoreFile} does not exist: ${store}")
        signingConfigs {
            upload {
                storeFile store
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signed) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
