<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-labelledby="knipsel-t">
  <title id="knipsel-t">Direction A, Knipsel</title>
  <desc>A lowercase b cut from paper with scissors, lying on a terracotta scrap; the counter of the b is cut as a little roof, the gazebo left as a wink.</desc>
  <!-- scraps that peek out from under the big one -->
  <path d="M58 3L94 7.5L91 38L60 34Z" fill="#2f8268"/>
  <path d="M0 36L9 34L11 84L1 86Z" fill="#8a6a10"/>
  <!-- the big cut scrap: eight scissor cuts, no two edges parallel -->
  <path d="M9 13L52 8.5L89 12L92.5 60L86 89L40 92L11 87.5L6.5 50Z" fill="#b4532f"/>
  <!-- the b, cut from cream paper -->
  <path d="M27 20L41.5 18.5L43 76L28.5 77.5Z" fill="#f7f1e6"/>
  <path transform="translate(55.5 58.5) scale(2.05)" d="M11.4 0C11.4 4.97 6.3 9 0 9C-5.52 9-10 4.97-10 0C-10-5.97-5.52-10.8 0-10.8C6.3-10.8 11.4-5.97 11.4 0Z" fill="#f7f1e6"/>
  <!-- the counter, cut out as a roof -->
  <path d="M57 50.5L69 65L46.5 65.5Z" fill="#b4532f" stroke="#b4532f" stroke-width="3" stroke-linejoin="round"/>
</svg>
