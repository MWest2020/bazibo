<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" role="img" aria-labelledby="apv-title">
  <title id="apv-title">Richting A, Prieel: het beeldmerk op 192, 48 en 24 px, op licht en donker, met het palet Papier</title>
  <defs>
    <g id="apv-mark">
